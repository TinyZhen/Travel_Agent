# Render Blueprint: New → Blueprint → pick this repo. Fill in the secret values when asked.
services:
  - type: web
    name: roameo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ROAMEO_ACCESS_CODE
        sync: false
      - key: LLM_MODEL
        value: anthropic/claude-haiku-5.5
      - key: ROAMEO_RATE_LIMIT
        value: "60"
